[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.load()"
position = "before"
payload = '''
-- Load BalatroSync Mod
pcall(function()
    local save_path = love.filesystem.getSaveDirectory() .. "/Mods/BalatroSync/sync_mod.lua"
    local f = loadfile(save_path) or loadfile("Mods/BalatroSync/sync_mod.lua")
    if not f and love.filesystem.getInfo("Mods/BalatroSync/sync_mod.lua") then
        f = love.filesystem.load("Mods/BalatroSync/sync_mod.lua")
    end
    if f then
        f()
        print("[BalatroSync] Mod script loaded successfully.")
    else
        print("[BalatroSync] Warning: Could not locate sync_mod.lua")
    end
end)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "G:start_up()"
position = "after"
payload = '''
    if BalatroSync and BalatroSync.init then
        BalatroSync.init()
    end
'''
match_indent = true

[[patches]]
